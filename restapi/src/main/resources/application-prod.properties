# Deployed MySQL. Host and credentials must come from the environment.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?characterEncoding=utf8
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false

# JWT and CORS must come from env. Prod refuses a missing/short secret, * origin, or http:// origin.
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Seed stays off unless an operator explicitly enables it for a demo environment.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.lead.password=${DEMO_LEAD_PASSWORD:}
app.seed.alex.password=${DEMO_MEMBER_ALEX_PASSWORD:}
app.seed.bailey.password=${DEMO_MEMBER_BAILEY_PASSWORD:}
