# MySQL via local Compose. Credentials are env-only; see docs/operators.md.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:taskmgmt}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=${MYSQL_USER:}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.seed.enabled=true
app.seed.lead.password=${DEMO_LEAD_PASSWORD:}
app.seed.alex.password=${DEMO_MEMBER_ALEX_PASSWORD:}
app.seed.bailey.password=${DEMO_MEMBER_BAILEY_PASSWORD:}
