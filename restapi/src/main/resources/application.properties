spring.application.name=restapi
server.port=8080

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=false

spring.flyway.enabled=true

# JWT signing key is env-only. TTL is short; users re-login after expiry. No refresh tokens in MVP.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=15m

# Browser origin for the web app. Comma-separated. Never use * in prod.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Demo seed is off unless a profile turns it on. Passwords come from env on local/prod.
app.seed.enabled=false
app.seed.team-name=Platform
app.seed.lead.email=casey@demo.local
app.seed.lead.display-name=Casey Lead
app.seed.alex.email=alex@demo.local
app.seed.alex.display-name=Alex Member
app.seed.bailey.email=bailey@demo.local
app.seed.bailey.display-name=Bailey Member
