spring.application.name=restapi
server.port=8080

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=false

spring.flyway.enabled=true

# Demo seed is off unless a profile turns it on. Passwords come from env on local/prod.
app.seed.enabled=false
app.seed.team-name=Platform
app.seed.lead.email=casey@demo.local
app.seed.lead.display-name=Casey Lead
app.seed.alex.email=alex@demo.local
app.seed.alex.display-name=Alex Member
app.seed.bailey.email=bailey@demo.local
app.seed.bailey.display-name=Bailey Member
