spring.application.name=restapi
server.port=8080

spring.datasource.url=jdbc:h2:mem:restapi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
spring.flyway.enabled=true

app.seed.enabled=true
app.seed.team-name=Platform
app.seed.lead.email=casey@demo.local
app.seed.lead.display-name=Casey Lead
app.seed.lead.password=test-only-lead-password
app.seed.alex.email=alex@demo.local
app.seed.alex.display-name=Alex Member
app.seed.alex.password=test-only-alex-password
app.seed.bailey.email=bailey@demo.local
app.seed.bailey.display-name=Bailey Member
app.seed.bailey.password=test-only-bailey-password
